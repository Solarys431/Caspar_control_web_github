<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Program Title</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .program-title {
            position: relative;
            opacity: 0;
            transform: scale(0.5) rotateX(90deg);
            perspective: 1000px;
        }
        
        .title-container {
            position: relative;
            padding: 60px 100px;
            background: linear-gradient(135deg, 
                rgba(0, 0, 0, 0.9) 0%, 
                rgba(30, 30, 30, 0.9) 50%,
                rgba(0, 0, 0, 0.9) 100%);
            border: 4px solid transparent;
            border-image: linear-gradient(45deg, 
                rgb(255, 193, 7) 0%, 
                rgb(255, 152, 0) 50%, 
                rgb(255, 193, 7) 100%) 1;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8),
                        inset 0 0 100px rgba(255, 193, 7, 0.1);
        }
        
        /* Background pattern */
        .title-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 193, 7, 0.03) 10px,
                rgba(255, 193, 7, 0.03) 20px
            );
            pointer-events: none;
        }
        
        /* Animated glow effect */
        .title-container::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, 
                transparent 30%, 
                rgba(255, 193, 7, 0.5) 50%, 
                transparent 70%);
            animation: glowMove 3s linear infinite;
            opacity: 0;
            pointer-events: none;
        }
        
        @keyframes glowMove {
            0% {
                transform: translateX(-100%) translateY(-100%);
            }
            100% {
                transform: translateX(100%) translateY(100%);
            }
        }
        
        .animate-in .title-container::after {
            opacity: 1;
        }
        
        .program-name {
            font-size: 72px;
            font-weight: 900;
            color: rgb(235, 235, 235);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9),
                         0 0 40px rgba(255, 193, 7, 0.5);
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(30px);
            position: relative;
            z-index: 2;
        }
        
        .program-subtitle {
            font-size: 32px;
            font-weight: 600;
            color: rgb(255, 193, 7);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transform: translateY(30px);
            position: relative;
            z-index: 2;
        }
        
        .time-slot {
            position: absolute;
            top: 30px;
            right: 40px;
            background: rgba(255, 193, 7, 0.9);
            color: rgb(16, 20, 30);
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 20px;
            font-weight: 700;
            opacity: 0;
            transform: translateX(50px);
        }
        
        .network-logo {
            position: absolute;
            bottom: 30px;
            left: 40px;
            width: 120px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateX(-50px);
        }
        
        .network-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.8));
        }
        
        /* Decorative elements */
        .corner-decoration {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid rgb(255, 193, 7);
            opacity: 0;
        }
        
        .corner-decoration.top-left {
            top: -30px;
            left: -30px;
            border-right: none;
            border-bottom: none;
        }
        
        .corner-decoration.top-right {
            top: -30px;
            right: -30px;
            border-left: none;
            border-bottom: none;
        }
        
        .corner-decoration.bottom-left {
            bottom: -30px;
            left: -30px;
            border-right: none;
            border-top: none;
        }
        
        .corner-decoration.bottom-right {
            bottom: -30px;
            right: -30px;
            border-left: none;
            border-top: none;
        }
        
        /* Animation classes */
        .animate-in .program-title {
            animation: titleReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        .animate-in .program-name {
            animation: fadeInUp 0.6s ease-out 0.5s forwards;
        }
        
        .animate-in .program-subtitle {
            animation: fadeInUp 0.6s ease-out 0.7s forwards;
        }
        
        .animate-in .time-slot {
            animation: fadeInRight 0.5s ease-out 0.9s forwards;
        }
        
        .animate-in .network-logo {
            animation: fadeInLeft 0.5s ease-out 0.9s forwards;
        }
        
        .animate-in .corner-decoration {
            animation: cornerFadeIn 0.4s ease-out 1.1s forwards;
        }
        
        .animate-out .program-title {
            animation: titleHide 0.6s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
        }
        
        @keyframes titleReveal {
            to {
                transform: scale(1) rotateX(0deg);
                opacity: 1;
            }
        }
        
        @keyframes titleHide {
            to {
                transform: scale(0.5) rotateX(-90deg);
                opacity: 0;
            }
        }
        
        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes fadeInRight {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes fadeInLeft {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes cornerFadeIn {
            to {
                opacity: 1;
            }
        }
        
        /* Theme variations */
        .title-container.news {
            border-image: linear-gradient(45deg, 
                rgb(220, 20, 60) 0%, 
                rgb(255, 0, 0) 50%, 
                rgb(220, 20, 60) 100%) 1;
        }
        
        .title-container.news .program-subtitle,
        .title-container.news .time-slot,
        .title-container.news .corner-decoration {
            color: rgb(220, 20, 60);
            background-color: rgb(220, 20, 60);
            border-color: rgb(220, 20, 60);
        }
        
        .title-container.sports {
            border-image: linear-gradient(45deg, 
                rgb(76, 175, 80) 0%, 
                rgb(139, 195, 74) 50%, 
                rgb(76, 175, 80) 100%) 1;
        }
        
        .title-container.sports .program-subtitle,
        .title-container.sports .time-slot,
        .title-container.sports .corner-decoration {
            color: rgb(76, 175, 80);
            background-color: rgb(76, 175, 80);
            border-color: rgb(76, 175, 80);
        }
    </style>
</head>
<body>
    <div class="program-title" id="program-title">
        <div class="title-container" id="title-container">
            <div class="corner-decoration top-left"></div>
            <div class="corner-decoration top-right"></div>
            <div class="corner-decoration bottom-left"></div>
            <div class="corner-decoration bottom-right"></div>
            
            <div class="time-slot" id="f2">21:00</div>
            <div class="network-logo">
                <img id="f3" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIwIiBoZWlnaHQ9IjYwIiB2aWV3Qm94PSIwIDAgMTIwIDYwIiBmaWxsPSJub25lIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPgo8cmVjdCB3aWR0aD0iMTIwIiBoZWlnaHQ9IjYwIiByeD0iMTAiIGZpbGw9IiNGRkMxMDciLz4KPHRleHQgeD0iNjAiIHk9IjM1IiBmb250LWZhbWlseT0iQXJpYWwgQmxhY2siIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiMxMDE0MUUiIHRleHQtYW5jaG9yPSJtaWRkbGUiPk5FVFdPUks8L3RleHQ+Cjwvc3ZnPg==" alt="Network">
            </div>
            
            <h1 class="program-name" id="f0">IL GRANDE SHOW</h1>
            <div class="program-subtitle" id="f1">EDIZIONE SPECIALE</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // CasparCG Template Functions
        let isPlaying = false;

        function play() {
            if (isPlaying) return;
            isPlaying = true;
            document.body.classList.add('animate-in');
            document.body.classList.remove('animate-out');
            console.log('Program Title: Playing');
        }

        function stop() {
            if (!isPlaying) return;
            isPlaying = false;
            document.body.classList.remove('animate-in');
            document.body.classList.add('animate-out');
            console.log('Program Title: Stopping');
            
            setTimeout(() => {
                document.body.classList.remove('animate-out');
            }, 700);
        }

        function update(data) {
            console.log('Program Title: Updating', data);
            
            // Parse string data if needed
            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                } catch (e) {
                    console.error('Failed to parse data:', e);
                    return;
                }
            }
            
            // Update program name
            if (data.f0 !== undefined) {
                document.getElementById('f0').textContent = data.f0.toUpperCase();
            }
            
            // Update subtitle
            if (data.f1 !== undefined) {
                const subtitle = document.getElementById('f1');
                if (data.f1 === '') {
                    subtitle.style.display = 'none';
                } else {
                    subtitle.style.display = 'block';
                    subtitle.textContent = data.f1.toUpperCase();
                }
            }
            
            // Update time slot
            if (data.f2 !== undefined) {
                const timeSlot = document.getElementById('f2');
                if (data.f2 === '') {
                    timeSlot.style.display = 'none';
                } else {
                    timeSlot.style.display = 'block';
                    timeSlot.textContent = data.f2;
                }
            }
            
            // Update network logo
            if (data.f3 !== undefined && data.f3 !== '') {
                const logo = document.getElementById('f3');
                if (data.f3.toLowerCase() === 'none') {
                    logo.parentElement.style.display = 'none';
                } else {
                    logo.parentElement.style.display = 'flex';
                    logo.src = data.f3;
                }
            }
            
            // Update theme
            if (data.f4 !== undefined) {
                const container = document.getElementById('title-container');
                container.classList.remove('default', 'news', 'sports', 'entertainment');
                if (data.f4) {
                    container.classList.add(data.f4);
                }
            }
        }

        function next() {
            console.log('Program Title: Next');
        }

        // Auto-play on load for testing
        window.addEventListener('load', () => {
            console.log('Program Title Template Loaded');
            // Uncomment for auto-preview
            // setTimeout(play, 500);
        });

        // Export for CasparCG
        window.play = play;
        window.stop = stop;
        window.update = update;
        window.next = next;
    </script>
</body>
</html>
