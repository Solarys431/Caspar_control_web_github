<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Breaking News Alert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }
        
        .breaking-news {
            position: absolute;
            top: 108px; /* 10% from top - safe area */
            left: 0;
            right: 0;
            width: 100%;
            height: 150px;
            opacity: 0;
            transform: translateY(-100%);
        }
        
        .alert-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                rgba(196, 30, 58, 0.98) 0%, 
                rgba(139, 21, 56, 0.98) 100%);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }
        
        .alert-stripe {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: repeating-linear-gradient(
                -45deg,
                #ffcc00,
                #ffcc00 10px,
                #ff9900 10px,
                #ff9900 20px
            );
            animation: stripeMove 1s linear infinite;
        }
        
        @keyframes stripeMove {
            0% { background-position: 0 0; }
            100% { background-position: 20px 0; }
        }
        
        .content-wrapper {
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 192px; /* Safe area margins */
        }
        
        .breaking-label {
            background: rgb(235, 235, 235);
            color: rgb(196, 30, 58);
            font-weight: 900;
            font-size: 32px;
            padding: 15px 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 0 8px 8px 0;
            margin-right: 40px;
            position: relative;
            opacity: 0;
            transform: scale(0);
            animation: none;
        }
        
        .breaking-label::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -20px;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 30px 0 30px 20px;
            border-color: transparent transparent transparent rgb(235, 235, 235);
        }
        
        .news-text {
            flex: 1;
            color: rgb(235, 235, 235);
            font-size: 36px;
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateX(-50px);
        }
        
        .live-indicator {
            position: absolute;
            top: 20px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
        }
        
        .live-dot {
            width: 20px;
            height: 20px;
            background: #ff0000;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { 
                transform: scale(1); 
                opacity: 1;
            }
            50% { 
                transform: scale(1.2); 
                opacity: 0.7;
            }
        }
        
        .live-text {
            color: rgb(235, 235, 235);
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Urgent flash effect */
        .urgent-flash {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, 
                rgba(255, 255, 255, 0) 0%, 
                rgba(255, 255, 255, 0.2) 100%);
            opacity: 0;
            pointer-events: none;
        }
        
        /* Animation classes */
        .animate-in .breaking-news {
            animation: slideDown 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        
        .animate-in .breaking-label {
            animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }
        
        .animate-in .news-text {
            animation: fadeInRight 0.5s ease-out 0.5s forwards;
        }
        
        .animate-in .live-indicator {
            animation: fadeIn 0.5s ease-out 0.7s forwards;
        }
        
        .animate-in .urgent-flash {
            animation: flash 0.3s ease-out 3 alternate;
        }
        
        .animate-out .breaking-news {
            animation: slideUp 0.4s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
        }
        
        @keyframes slideDown {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes slideUp {
            to {
                transform: translateY(-100%);
                opacity: 0;
            }
        }
        
        @keyframes scaleIn {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        @keyframes fadeInRight {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        
        @keyframes flash {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="breaking-news" id="breaking-news">
        <div class="alert-container">
            <div class="alert-stripe"></div>
            <div class="urgent-flash"></div>
            <div class="content-wrapper">
                <div class="breaking-label">BREAKING NEWS</div>
                <div class="news-text" id="f0">ULTIMA ORA: IMPORTANTE NOTIZIA IN ARRIVO</div>
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    <div class="live-text">LIVE</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // CasparCG Template Functions
        let isPlaying = false;
        let urgencyLevel = 'normal';

        function play() {
            if (isPlaying) return;
            isPlaying = true;
            document.body.classList.add('animate-in');
            document.body.classList.remove('animate-out');
            
            // Play alert sound if urgent
            if (urgencyLevel === 'urgent') {
                // Audio would be handled by CasparCG mixer
                console.log('Breaking News: Playing URGENT');
            } else {
                console.log('Breaking News: Playing');
            }
        }

        function stop() {
            if (!isPlaying) return;
            isPlaying = false;
            document.body.classList.remove('animate-in');
            document.body.classList.add('animate-out');
            console.log('Breaking News: Stopping');
            
            setTimeout(() => {
                document.body.classList.remove('animate-out');
            }, 500);
        }

        function update(data) {
            console.log('Breaking News: Updating', data);
            
            // Parse string data if needed
            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                } catch (e) {
                    console.error('Failed to parse data:', e);
                    return;
                }
            }
            
            // Update news text
            if (data.f0 !== undefined) {
                document.getElementById('f0').textContent = data.f0.toUpperCase();
            }
            
            // Update urgency level
            if (data.f1 !== undefined) {
                urgencyLevel = data.f1;
                const container = document.querySelector('.alert-container');
                if (data.f1 === 'urgent') {
                    container.style.background = 'linear-gradient(90deg, rgba(255, 0, 0, 0.98) 0%, rgba(180, 0, 0, 0.98) 100%)';
                } else {
                    container.style.background = 'linear-gradient(90deg, rgba(196, 30, 58, 0.98) 0%, rgba(139, 21, 56, 0.98) 100%)';
                }
            }
            
            // Show/hide live indicator
            if (data.f2 !== undefined) {
                const liveIndicator = document.querySelector('.live-indicator');
                liveIndicator.style.display = data.f2 === 'true' ? 'flex' : 'none';
            }
        }

        function next() {
            console.log('Breaking News: Next');
        }

        // Auto-play on load for testing
        window.addEventListener('load', () => {
            console.log('Breaking News Template Loaded');
            // Uncomment for auto-preview
            // setTimeout(play, 500);
        });

        // Export for CasparCG
        window.play = play;
        window.stop = stop;
        window.update = update;
        window.next = next;
    </script>
</body>
</html>
