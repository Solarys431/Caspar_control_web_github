<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Commercial Bumper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .bumper-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
        }
        
        /* Background animation layers */
        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        
        .bg-gradient {
            background: radial-gradient(circle at center, 
                rgba(138, 43, 226, 0.9) 0%, 
                rgba(75, 0, 130, 0.95) 50%,
                rgba(16, 20, 30, 0.98) 100%);
            opacity: 0;
            transform: scale(1.5);
        }
        
        .bg-pattern {
            background: repeating-conic-gradient(
                from 0deg at 50% 50%,
                transparent 0deg,
                rgba(255, 255, 255, 0.03) 10deg,
                transparent 20deg
            );
            animation: rotatePattern 30s linear infinite;
            opacity: 0;
        }
        
        @keyframes rotatePattern {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .bg-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            opacity: 0;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 10s infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }
        
        /* Main content */
        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            opacity: 0;
            transform: scale(0);
        }
        
        .bumper-text {
            font-size: 96px;
            font-weight: 900;
            color: rgb(235, 235, 235);
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8),
                         0 0 60px rgba(138, 43, 226, 0.8);
            margin-bottom: 30px;
            opacity: 0;
            transform: translateZ(-100px) rotateY(90deg);
            perspective: 1000px;
        }
        
        .countdown-wrapper {
            display: inline-block;
            position: relative;
            opacity: 0;
            transform: translateY(50px);
        }
        
        .countdown-text {
            font-size: 36px;
            font-weight: 700;
            color: rgba(235, 235, 235, 0.8);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        
        .countdown-timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .countdown-number {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, 
                rgba(138, 43, 226, 0.3) 0%, 
                rgba(75, 0, 130, 0.5) 100%);
            border: 3px solid rgba(138, 43, 226, 0.8);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            font-weight: 900;
            color: rgb(235, 235, 235);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }
        
        .countdown-number::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                transparent, 
                rgba(138, 43, 226, 0.8), 
                transparent);
            animation: borderGlow 2s linear infinite;
        }
        
        @keyframes borderGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .countdown-label {
            font-size: 16px;
            font-weight: 600;
            color: rgba(235, 235, 235, 0.6);
            text-transform: uppercase;
            position: absolute;
            bottom: -30px;
            width: 100%;
            text-align: center;
        }
        
        /* Logo section */
        .logo-section {
            margin-top: 60px;
            opacity: 0;
            transform: translateY(30px);
        }
        
        .logo-container {
            display: inline-block;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 2px solid rgba(138, 43, 226, 0.3);
        }
        
        .logo-container img {
            height: 60px;
            width: auto;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.8));
        }
        
        /* Animation classes */
        .animate-in .bumper-container {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        .animate-in .bg-gradient {
            animation: bgFadeScale 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        
        .animate-in .bg-pattern {
            animation: fadeIn 1s ease-out 0.3s forwards;
        }
        
        .animate-in .bg-particles {
            animation: fadeIn 1.2s ease-out 0.5s forwards;
        }
        
        .animate-in .content-wrapper {
            animation: contentScale 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
        }
        
        .animate-in .bumper-text {
            animation: text3D 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.6s forwards;
        }
        
        .animate-in .countdown-wrapper {
            animation: fadeInUp 0.6s ease-out 0.9s forwards;
        }
        
        .animate-in .logo-section {
            animation: fadeInUp 0.6s ease-out 1.1s forwards;
        }
        
        .animate-out .bumper-container {
            animation: fadeOut 0.5s ease-in forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        @keyframes fadeOut {
            to { opacity: 0; }
        }
        
        @keyframes bgFadeScale {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes contentScale {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes text3D {
            to {
                opacity: 1;
                transform: translateZ(0) rotateY(0deg);
            }
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Countdown animation */
        .countdown-pulse {
            animation: pulse 1s ease-in-out;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="bumper-container" id="bumper-container">
        <div class="bg-layer bg-gradient"></div>
        <div class="bg-layer bg-pattern"></div>
        <div class="bg-layer bg-particles" id="particles"></div>
        
        <div class="content-wrapper">
            <h1 class="bumper-text" id="f0">PUBBLICITÀ</h1>
            
            <div class="countdown-wrapper" id="countdown-wrapper">
                <div class="countdown-text" id="f1">IL PROGRAMMA RIPRENDE TRA</div>
                <div class="countdown-timer">
                    <div class="countdown-number" id="minutes">
                        <span id="minute-value">02</span>
                        <span class="countdown-label">MIN</span>
                    </div>
                    <div class="countdown-number" id="seconds">
                        <span id="second-value">30</span>
                        <span class="countdown-label">SEC</span>
                    </div>
                </div>
            </div>
            
            <div class="logo-section">
                <div class="logo-container">
                    <img id="f2" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjYwIiB2aWV3Qm94PSIwIDAgMjAwIDYwIiBmaWxsPSJub25lIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPgo8cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjYwIiByeD0iMTAiIGZpbGw9IiM4QTJCRTIiLz4KPHRleHQgeD0iMTAwIiB5PSIzNSIgZm9udC1mYW1pbHk9IkFyaWFsIEJsYWNrIiBmb250LXNpemU9IjI0IiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+WU9VUiBORVRXT1JLPC90ZXh0Pgo8L3N2Zz4=" alt="Network Logo">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // CasparCG Template Functions
        let isPlaying = false;
        let countdownInterval = null;
        let countdownTime = 150; // Default 2:30 in seconds
        
        // Generate particles
        function generateParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        function play() {
            if (isPlaying) return;
            isPlaying = true;
            document.body.classList.add('animate-in');
            document.body.classList.remove('animate-out');
            
            // Start countdown
            startCountdown();
            
            console.log('Commercial Bumper: Playing');
        }

        function stop() {
            if (!isPlaying) return;
            isPlaying = false;
            document.body.classList.remove('animate-in');
            document.body.classList.add('animate-out');
            
            // Stop countdown
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            
            console.log('Commercial Bumper: Stopping');
            
            setTimeout(() => {
                document.body.classList.remove('animate-out');
            }, 600);
        }

        function update(data) {
            console.log('Commercial Bumper: Updating', data);
            
            // Parse string data if needed
            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                } catch (e) {
                    console.error('Failed to parse data:', e);
                    return;
                }
            }
            
            // Update main text
            if (data.f0 !== undefined) {
                document.getElementById('f0').textContent = data.f0.toUpperCase();
            }
            
            // Update countdown text
            if (data.f1 !== undefined) {
                document.getElementById('f1').textContent = data.f1.toUpperCase();
            }
            
            // Update logo
            if (data.f2 !== undefined && data.f2 !== '') {
                const logo = document.getElementById('f2');
                if (data.f2.toLowerCase() === 'none') {
                    logo.parentElement.parentElement.style.display = 'none';
                } else {
                    logo.parentElement.parentElement.style.display = 'block';
                    logo.src = data.f2;
                }
            }
            
            // Update countdown time (in seconds)
            if (data.f3 !== undefined) {
                countdownTime = parseInt(data.f3);
                updateCountdownDisplay();
            }
            
            // Show/hide countdown
            if (data.f4 !== undefined) {
                const countdownWrapper = document.getElementById('countdown-wrapper');
                countdownWrapper.style.display = data.f4 === 'false' ? 'none' : 'block';
            }
        }

        function next() {
            console.log('Commercial Bumper: Next');
        }
        
        function startCountdown() {
            if (countdownInterval) return;
            
            updateCountdownDisplay();
            
            countdownInterval = setInterval(() => {
                countdownTime--;
                
                if (countdownTime <= 0) {
                    countdownTime = 0;
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                
                updateCountdownDisplay();
                
                // Pulse animation on second change
                document.getElementById('seconds').classList.add('countdown-pulse');
                setTimeout(() => {
                    document.getElementById('seconds').classList.remove('countdown-pulse');
                }, 500);
                
                // Pulse minutes on minute change
                if (countdownTime % 60 === 59) {
                    document.getElementById('minutes').classList.add('countdown-pulse');
                    setTimeout(() => {
                        document.getElementById('minutes').classList.remove('countdown-pulse');
                    }, 500);
                }
            }, 1000);
        }
        
        function updateCountdownDisplay() {
            const minutes = Math.floor(countdownTime / 60);
            const seconds = countdownTime % 60;
            
            document.getElementById('minute-value').textContent = String(minutes).padStart(2, '0');
            document.getElementById('second-value').textContent = String(seconds).padStart(2, '0');
        }

        // Auto-play on load for testing
        window.addEventListener('load', () => {
            console.log('Commercial Bumper Template Loaded');
            generateParticles();
            updateCountdownDisplay();
            // Uncomment for auto-preview
            // setTimeout(play, 500);
        });

        // Export for CasparCG
        window.play = play;
        window.stop = stop;
        window.update = update;
        window.next = next;
    </script>
</body>
</html>
