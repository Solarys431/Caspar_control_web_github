<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Lower Third Professional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Arial', 'Helvetica', sans-serif;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .lower-third {
            position: absolute;
            bottom: 162px; /* 15% from bottom - safe area */
            left: 192px; /* 10% from left - safe area */
            width: 800px;
            min-height: 120px;
            opacity: 0;
            transform: translateX(-100%);
        }
        
        .background-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        .main-bar {
            background: linear-gradient(90deg, 
                rgba(0, 60, 130, 0.95) 0%, 
                rgba(0, 80, 160, 0.95) 50%,
                rgba(0, 60, 130, 0.95) 100%);
            border-left: 6px solid #ff6b35;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            padding: 20px 30px;
            position: relative;
            overflow: hidden;
        }
        
        .main-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.1) 50%, 
                transparent 100%);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }
        
        .text-container {
            position: relative;
            z-index: 2;
        }
        
        .name {
            font-size: 42px;
            font-weight: 700;
            color: rgb(235, 235, 235); /* Broadcast-safe white */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.1;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(20px);
        }
        
        .title {
            font-size: 28px;
            font-weight: 400;
            color: rgba(235, 235, 235, 0.9);
            line-height: 1.2;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(20px);
        }
        
        .logo-container {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(-50%) scale(0);
        }
        
        .logo-container img {
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
        }
        
        /* Animation classes */
        .animate-in .lower-third {
            animation: slideIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        
        .animate-in .name {
            animation: fadeInUp 0.4s ease-out 0.3s forwards;
        }
        
        .animate-in .title {
            animation: fadeInUp 0.4s ease-out 0.4s forwards;
        }
        
        .animate-in .logo-container {
            animation: popIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s forwards;
        }
        
        .animate-out .lower-third {
            animation: slideOut 0.5s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
        }
        
        @keyframes slideIn {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOut {
            to {
                transform: translateX(-100%);
                opacity: 0;
            }
        }
        
        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes popIn {
            to {
                transform: translateY(-50%) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="lower-third" id="lower-third">
        <div class="background-container">
            <div class="main-bar">
                <div class="text-container">
                    <div class="name" id="f0">MARIO ROSSI</div>
                    <div class="title" id="f1">Direttore Generale</div>
                </div>
                <div class="logo-container" id="logo-container">
                    <img id="f2" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iMzAiIGN5PSIzMCIgcj0iMzAiIGZpbGw9IiNGRjZCMzUiLz4KPHRleHQgeD0iMzAiIHk9IjM1IiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IndoaXRlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5MT0dPPC90ZXh0Pgo8L3N2Zz4=" alt="Logo">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // CasparCG Template Functions
        let isPlaying = false;

        function play() {
            if (isPlaying) return;
            isPlaying = true;
            document.body.classList.add('animate-in');
            document.body.classList.remove('animate-out');
            console.log('Lower Third: Playing');
        }

        function stop() {
            if (!isPlaying) return;
            isPlaying = false;
            document.body.classList.remove('animate-in');
            document.body.classList.add('animate-out');
            console.log('Lower Third: Stopping');
            
            setTimeout(() => {
                document.body.classList.remove('animate-out');
            }, 600);
        }

        function update(data) {
            console.log('Lower Third: Updating', data);
            
            // Parse string data if needed
            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                } catch (e) {
                    console.error('Failed to parse data:', e);
                    return;
                }
            }
            
            // Update fields
            if (data.f0 !== undefined) {
                document.getElementById('f0').textContent = data.f0;
            }
            if (data.f1 !== undefined) {
                document.getElementById('f1').textContent = data.f1;
            }
            if (data.f2 !== undefined && data.f2 !== '') {
                const logoContainer = document.getElementById('logo-container');
                const img = document.getElementById('f2');
                if (data.f2.toLowerCase() === 'none' || data.f2 === '') {
                    logoContainer.style.display = 'none';
                } else {
                    logoContainer.style.display = 'flex';
                    img.src = data.f2;
                }
            }
        }

        function next() {
            console.log('Lower Third: Next');
        }

        // Auto-play on load for testing
        window.addEventListener('load', () => {
            console.log('Lower Third Template Loaded');
            // Uncomment for auto-preview
            // setTimeout(play, 500);
        });

        // Export for CasparCG
        window.play = play;
        window.stop = stop;
        window.update = update;
        window.next = next;
    </script>
</body>
</html>
